name: Validate practice tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JSON, source fidelity and keys
        run: python3 tools/validate.py
      - name: Check scoring regression suite
        run: node --test tests/*.test.mjs
